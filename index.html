<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>キャラクターAR</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f2;color:#183c35;font:16px/1.6 system-ui,-apple-system,sans-serif}
main{max-width:560px;margin:auto;padding:20px 16px calc(24px + env(safe-area-inset-bottom))}h1{margin:0;font-size:28px}p{margin:8px 0 16px}.tag{font-size:12px;letter-spacing:.12em;color:#507468;font-weight:700}
.stage{position:relative;width:100%;height:52vh;height:52svh;min-height:240px;max-height:580px;overflow:hidden;border-radius:24px;background:radial-gradient(ellipse at center,#385f54,#162f2a);isolation:isolate}
video{position:absolute;width:100%;height:100%;object-fit:cover}.hint{position:absolute;top:18px;left:16px;right:16px;text-align:center;color:#e4eee7;font-size:14px;pointer-events:none}
#character{position:absolute;left:0;top:0;object-fit:contain;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;filter:drop-shadow(0 12px 10px #0003)}
#character:active{cursor:grabbing}[hidden]{display:none!important}.row{display:flex;gap:8px;margin-top:12px}.row>*{flex:1;min-width:0}
button,.save{min-height:48px;border:1px solid #c5d4ca;border-radius:14px;background:white;color:#183c35;font:inherit;font-weight:700;padding:11px 8px;cursor:pointer;text-align:center;text-decoration:none}
button.primary{background:#226b53;color:white;border-color:#226b53}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #b27a19;outline-offset:3px}
.status{padding:12px;background:#e6eee7;border-radius:12px;font-size:14px;overflow-wrap:anywhere}.error{color:#8b2828;background:#fff0eb}.note{font-size:13px;color:#50675d}
details{margin-top:24px;border-top:1px solid #d5dfd5;padding-top:18px}summary{font-weight:700;cursor:pointer;min-height:44px}label{display:block;margin-top:12px}input{width:100%;min-width:0;padding:12px;border:1px solid #b6c9bc;border-radius:10px;font:inherit;font-size:16px}#qrImage{display:block;max-width:100%;width:300px;height:auto;margin:16px auto;image-rendering:pixelated}#qrTarget{overflow-wrap:anywhere;font-size:13px}
</style>
<main>
  <div class="tag">CAMERA + CHARACTER</div>
  <h1>キャラクターAR</h1>
  <p>カメラを起動して、キャラクターを指で動かそう。</p>
  <div class="stage" id="stage">
    <video id="video" autoplay muted playsinline aria-label="背面カメラの映像"></video>
    <div class="hint" id="hint">カメラを起動すると、ここに映像が表示されます</div>
    <img id="character" alt="指で動かせる仮のキャラクター" draggable="false" hidden>
  </div>
  <div class="row"><button id="start" class="primary">カメラを起動</button><button id="stop" disabled>カメラ停止</button></div>
  <div class="row"><button id="smaller" disabled>小さく</button><button id="larger" disabled>大きく</button><button id="reset" disabled>位置を戻す</button></div>
  <p id="status" class="status" role="status" aria-live="polite">カメラは停止中です。</p>
  <p id="imageError" class="status error" role="alert" hidden></p>
  <p class="note">映像はこの端末で表示するだけ。録画・音声取得・外部送信は行いません。キャラクターは画面に重ねた2D画像です。</p>
  <details>
    <summary>公開したページのQRコードを作る</summary>
    <p class="note">公開後、Safariで開けることを確認したHTTPSのURLを入力してください。URLの存在は自動確認しません。</p>
    <label for="url">実際の公開URL</label>
    <input id="url" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="公開後のURLを貼り付け">
    <div class="row"><button id="current">このページのURLを入力</button><button id="generate" class="primary">QRコード作成</button></div>
    <p id="qrStatus" role="status" aria-live="polite"></p>
    <div id="qrResult" hidden>
      <img id="qrImage" alt="入力した公開URLのQRコード">
      <p id="qrTarget"></p>
      <div class="row"><a id="download" class="save" download="character-ar-qr.png">PNGを保存</a><button id="share">画像を共有</button></div>
      <p class="note">保存できないときはQR画像を長押しして保存してください。別のスマートフォンのカメラで読み取り、開くURLを確認してください。</p>
    </div>
  </details>
</main>
<!-- 同梱の無料ライブラリ。CDNへの接続は不要です。 -->
<script src="qr.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const stage = $('stage'), video = $('video'), character = $('character');
let stream = null, generation = 0, ready = false, scale = 1, x = .5, y = .62, drag = null;
const clamp = (v, low, high) => Math.max(low, Math.min(high, v));
function status(text, error = false) {
  $('status').textContent = text;
  $('status').classList.toggle('error', error);
}
function layout() {
  if (!ready) return;
  const w = stage.clientWidth, h = stage.clientHeight;
  const ratio = character.naturalHeight / character.naturalWidth;
  const base = Math.min(w * .48, h * .52 / ratio);
  const width = Math.min(base * scale, w * .94, h * .94 / ratio), height = width * ratio;
  x = clamp(x, width / (2*w), 1-width / (2*w));
  y = clamp(y, height / (2*h), 1-height / (2*h));
  Object.assign(character.style, {width: width+'px', height: height+'px', left:(x*w-width/2)+'px', top:(y*h-height/2)+'px'});
  $('smaller').disabled = scale <= .4;
  $('larger').disabled = scale >= 2;
}
character.onload = () => {
  ready = true; character.hidden = false; $('imageError').hidden = true;
  $('reset').disabled = false; layout();
};
character.onerror = () => {
  ready = false; character.hidden = true;
  ['smaller','larger','reset'].forEach(id => $(id).disabled = true);
  $('imageError').hidden = false;
  $('imageError').textContent = '画像を読み込めません。index.htmlと同じ場所に、背景透過PNGを character.png という名前で置いてください。大文字・小文字も確認してください。';
};
character.src = './character.png';
$('smaller').onclick = () => { scale = Math.max(.4, +(scale-.2).toFixed(1)); layout(); };
$('larger').onclick = () => { scale = Math.min(2, +(scale+.2).toFixed(1)); layout(); };
$('reset').onclick = () => { scale=1; x=.5; y=.62; layout(); };
character.onpointerdown = e => {
  if (drag || !e.isPrimary) return;
  e.preventDefault(); character.setPointerCapture(e.pointerId);
  drag = {id:e.pointerId, px:e.clientX, py:e.clientY, x, y};
};
character.onpointermove = e => {
  if (!drag || e.pointerId !== drag.id) return;
  x = drag.x + (e.clientX-drag.px)/stage.clientWidth;
  y = drag.y + (e.clientY-drag.py)/stage.clientHeight;
  layout();
};
function endDrag(){ drag=null; }
character.onpointerup = character.onpointercancel = character.onlostpointercapture = endDrag;
window.addEventListener('resize', () => { endDrag(); layout(); });
if (window.ResizeObserver) new ResizeObserver(layout).observe(stage);
function stopCamera(message = 'カメラを停止しました。再び起動できます。') {
  generation++;
  if (stream) stream.getTracks().forEach(track => track.stop());
  stream=null; video.pause(); video.srcObject=null;
  $('start').disabled=false; $('stop').disabled=true; $('hint').hidden=false;
  status(message);
}
const errors = {
  NotAllowedError:'カメラの使用が許可されていません。Safariのページメニューの「Webサイトの設定」でカメラを「確認」または「許可」にして、再度起動してください。',
  NotFoundError:'使用できるカメラが見つかりません。カメラ付きのiPhoneで開いてください。',
  NotReadableError:'カメラを開始できません。他のカメラ使用アプリを閉じて、もう一度お試しください。',
  OverconstrainedError:'この端末では指定のカメラ設定を利用できません。Safariを更新して再度お試しください。',
  SecurityError:'ブラウザや端末の設定でカメラが制限されています。Safariやスクリーンタイムの設定を確認してください。',
  AbortError:'カメラの開始が中断されました。もう一度お試しください。'
};
$('start').onclick = async () => {
  if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
    status('カメラにはHTTPSと対応ブラウザが必要です。GitHub Pagesの https:// で始まる公開URLをSafariで開いてください。',true); return;
  }
  const token = ++generation;
  $('start').disabled=true; $('stop').disabled=false;
  status('カメラの許可を待っています。表示された確認で「許可」を選んでください。');
  try {
    const acquired = await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'}}});
    if (token !== generation || document.hidden) { acquired.getTracks().forEach(t=>t.stop()); return; }
    stream=acquired; video.srcObject=acquired;
    acquired.getVideoTracks().forEach(t => t.addEventListener('ended',()=>{
      if (stream===acquired) stopCamera('カメラが中断されました。再度「カメラを起動」を押してください。');
    }));
    await video.play();
    if (token !== generation) return;
    $('hint').hidden=true; status('カメラ起動中です。キャラクターを指で動かせます。');
  } catch (error) {
    if (token !== generation) return;
    stopCamera(); status(errors[error.name] || 'カメラを起動できません。Safariでページを開き直してお試しください。',true);
  }
};
$('stop').onclick=()=>stopCamera();
document.addEventListener('visibilitychange',()=>{if(document.hidden) stopCamera('画面を離れたためカメラを停止しました。再度起動してください。');});
window.addEventListener('pagehide',()=>stopCamera());
let qrFile=null;
function clearQR(){ $('qrResult').hidden=true; qrFile=null; $('qrImage').removeAttribute('src'); $('download').removeAttribute('href'); }
$('url').addEventListener('input',()=>{clearQR(); $('qrStatus').textContent='';});
$('current').onclick=()=>{
  clearQR();
  if(location.protocol!=='https:'){ $('qrStatus').textContent='公開済みのHTTPSページで使ってください。'; return; }
  $('url').value=location.origin+location.pathname;
  $('qrStatus').textContent='このURLが別の端末でも開けることを確認してから作成してください。';
};
$('generate').onclick=()=>{
  clearQR();
  try {
    const url=new URL($('url').value.trim());
    if(url.protocol!=='https:' || url.username || url.password) throw Error('HTTPSの公開URLを入力してください。ID・パスワードを含むURLは使えません。');
    const host=url.hostname.toLowerCase();
    if(host==='localhost' || host.endsWith('.localhost') || host.endsWith('.local') || host.includes(':') || /^\d+\.\d+\.\d+\.\d+$/.test(host) || host==='example.com' || host.endsWith('.example.com') || /\.(test|invalid|example)$/.test(host)) throw Error('ローカル用・例示用のURLではなく、実際の公開URLを入力してください。');
    if(url.href.length>800) throw Error('URLが長すぎます。800文字以内の公開URLを入力してください。');
    if(typeof qrcode!=='function') throw Error('QR機能を読み込めません。同じ場所に qr.js をアップロードしてください。');
    const qr=qrcode(0,'M'); qr.addData(url.href,'Byte'); qr.make();
    const n=qr.getModuleCount(), cell=8, margin=4, canvas=document.createElement('canvas');
    canvas.width=canvas.height=(n+margin*2)*cell;
    const ctx=canvas.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.fillStyle='#000';
    for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(qr.isDark(r,c)) ctx.fillRect((c+margin)*cell,(r+margin)*cell,cell,cell);
    const data=canvas.toDataURL('image/png');
    $('qrImage').src=data; $('download').href=data;
    const bytes=Uint8Array.from(atob(data.split(',')[1]),c=>c.charCodeAt(0));
    qrFile=new File([bytes],'character-ar-qr.png',{type:'image/png'});
    $('qrTarget').textContent=url.href; $('qrResult').hidden=false;
    $('qrStatus').textContent='作成しました。別のスマートフォンで読み取りを確認してください。';
  } catch(error) { $('qrStatus').textContent=error instanceof TypeError ? '正しい公開URLを入力してください。' : error.message; }
};
$('share').onclick=async()=>{
  if(!qrFile) return;
  try {
    if(navigator.canShare?.({files:[qrFile]})) await navigator.share({files:[qrFile],title:'キャラクターAR'});
    else $('qrStatus').textContent='このブラウザでは画像共有を使えません。「PNGを保存」または画像の長押しで保存し、写真やファイルから共有してください。';
  } catch(error) { $('qrStatus').textContent=error.name==='AbortError'?'共有をキャンセルしました。':'共有できませんでした。画像を長押しして保存してください。'; }
};
</script>
</html>
